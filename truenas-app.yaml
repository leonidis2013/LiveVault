# TrueNAS SCALE: Apps > Discover Apps > Custom App > "Install via YAML", paste this.
# Then open https://<TrueNAS IP>:9543, accept the certificate warning once, and create the admin account.
# Change the host ports if 9543 or 9580 are taken.
# Data lives in a Docker named volume.
services:
  livevault:
    image: ghcr.io/leonidis2013/livevault:latest
    # check for a newer image every time the app starts or restarts
    pull_policy: always
    container_name: livevault
    restart: unless-stopped
    ports:
      - "9543:8443"
      # plain http: LiveWebMixer reaches LiveVault through this port
      - "9580:8080"
    volumes:
      - livevault-data:/data
      # optional watch folder: share a dataset over SMB and mount it here, for example
      # - /mnt/tank/shares/LiveVault Inbox:/watch
    environment:
      TZ: America/Chicago

volumes:
  livevault-data:
