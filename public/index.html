<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>LiveVault</title>
<script>
(function () {
  var p = 'dark';
  try { p = localStorage.getItem('lv-theme') || 'dark'; } catch (e) {}
  var light = p === 'light' || (p === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches);
  document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');
})();
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23151a21'/%3E%3Crect x='6' y='7' width='20' height='18' rx='3' fill='none' stroke='%23252c36' stroke-width='2'/%3E%3Cpath d='M10 13v6M13 11v10M16 14v4M19 10v12M22 13v6' stroke='%234c8dff' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header>
  <h1>LiveVault <span class="ver" id="hVer"></span><small id="hSub">Multitrack library</small></h1>
  <nav id="nav" class="hide"></nav>
  <div id="status"></div>
  <button id="meBtn" class="hide"></button>
  <button id="themeBtn" class="gear" title="Light / dark" aria-label="Light or dark"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
</header>
<main id="main"></main>
<div id="load" class="hide"><div class="card"><h2>Loading the preview</h2><div class="bar"><i id="loadBar"></i></div><div class="note" id="loadTxt"></div></div></div>
<dialog id="dlg"></dialog>
<script type="module" src="js/app.js"></script>
</body>
</html>
